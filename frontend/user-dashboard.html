<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
        }

        .navbar button {
            background: #00c6ff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
        }

        /* CONTAINER */
        .container {
            padding: 30px;
        }

        /* WELCOME */
        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 24px;
        }

        /* STATS */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        /* ACTION GRID */
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 20px;
        }

        /* ACTION CARD */
        .action-card {
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .action-card h3 {
            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="navbar">
    <h2>👤 User Dashboard</h2>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- WELCOME -->
    <div class="welcome">
        <h2>Welcome 👋</h2>
        <p>Manage your parking bookings easily</p>
    </div>

    <!-- STATS -->
    <div class="cards">
        <div class="card">
            <h3>Active Booking</h3>
            <p id="active">0</p>
        </div>
        <div class="card">
            <h3>Total History</h3>
            <p id="history">0</p>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">

        <div class="action-card" onclick="goSlots()">
            <h3>🚗 View Slots</h3>
            <p>Check available parking slots</p>
        </div>

        <div class="action-card" onclick="goMyBookings()">
            <h3>📄 My Booking</h3>
            <p>See your current booking</p>
        </div>

        <div class="action-card" onclick="goHistory()">
            <h3>📜 History</h3>
            <p>View past bookings</p>
        </div>

    </div>

</div>

<script>

    /* LOAD USER STATS */
    async function loadStats(){

        const activeRes = await fetch("http://localhost:8080/booking/active");
        const active = await activeRes.json();

        const historyRes = await fetch("http://localhost:8080/booking/history");
        const history = await historyRes.json();

        document.getElementById("active").innerText = active.length;
        document.getElementById("history").innerText = history.length;
    }

    loadStats();

    /* NAVIGATION */
    function goSlots(){
        window.location.href="slots.html";
    }

    function goMyBookings(){
        window.location.href="my-bookings.html";
    }

    function goHistory(){
        window.location.href="history.html";
    }

    function logout(){
        localStorage.clear();
        window.location.href="login.html";
    }

</script>

</body>
</html>
