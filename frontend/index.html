<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Smart Parking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        /* HERO SECTION */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-primary {
            background: #00c6ff;
            color: black;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #00c6ff;
            color: white;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        /* GLASS CARD */
        .card {
            margin-top: 40px;
            padding: 20px 30px;
            border-radius: 15px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🚗 Smart Parking</div>
</div>

<div class="hero">
    <h1>Find Parking Instantly</h1>
    <p>Smart, Fast & Hassle-Free Parking System</p>

    <div class="buttons">
        <button class="btn btn-primary" onclick="goLogin()">Login</button>
        <button class="btn btn-secondary" onclick="goSignup()">Signup</button>
    </div>

    <div class="card">
         Real-time slot booking | 📊 Smart management | 🔒 Secure system
    </div>
</div>

<script>
    function goLogin(){
        window.location.href = "login.html";
    }

    function goSignup(){
        window.location.href = "signup.html";
    }
</script>

</body>
</html>
