<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link rel="stylesheet" href="css/style.css">

    <style>

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #00e5ff;
            margin-bottom: 10px;
        }

        .card p {
            margin: 5px 0;
            font-size: 14px;
        }

        .status {
            margin-top: 8px;
            font-weight: bold;
            color: #00ff88;
        }

        /* Buttons */
        .btn {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .complete {
            background: #00c853;
            color: white;
        }

        .cancel {
            background: #ff4d4d;
            color: white;
            margin-left: 5px;
        }

        .empty {
            text-align: center;
            margin-top: 50px;
            opacity: 0.7;
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="navbar">
    <h2>📋 My Bookings</h2>
    <button onclick="goBack()">Back</button>
</div>

<div id="list" class="container"></div>

<script>

    function goBack() {
        window.location.href = "user-dashboard.html";
    }

    async function loadBookings() {

        const res = await fetch("http://localhost:8080/booking/active");

        if (!res.ok) {
            document.getElementById("list").innerHTML =
                "<p class='empty'>Backend not running ❌</p>";
            return;
        }

        const data = await res.json();

        if (data.length === 0) {
            document.getElementById("list").innerHTML =
                "<p class='empty'>No active bookings 🚗</p>";
            return;
        }

        let html = "";

        data.forEach(b => {
            html += `
        <div class="card">
            <h3>🚗 Slot ${b.slotNumber}</h3>
            <p><b>Vehicle:</b> ${b.vehicleType}</p>
            <p><b>Number:</b> ${b.vehicleNumber}</p>
            <p><b>Time:</b> ${b.bookingTime}</p>

            <p class="status">ACTIVE</p>

            <button class="btn complete" onclick="completeBooking(${b.id})">
                ✔ Complete
            </button>

            <button class="btn cancel" onclick="cancelBooking(${b.id})">
                ✖ Cancel
            </button>
        </div>
        `;
        });

        document.getElementById("list").innerHTML = html;
    }


    // ✅ COMPLETE BOOKING
    async function completeBooking(id) {

        await fetch(`http://localhost:8080/booking/complete/${id}`, {
            method: "PUT"
        });

        loadBookings(); // refresh
    }


    // ❌ CANCEL BOOKING
    async function cancelBooking(id) {

        await fetch(`http://localhost:8080/booking/cancel/${id}`, {
            method: "PUT"
        });

        loadBookings(); // refresh
    }


    loadBookings();

</script>

</body>
</html>
