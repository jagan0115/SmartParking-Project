<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Book Slot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.5);
        }

        .navbar h2 {
            font-size: 22px;
        }

        /* BACK BUTTON FIXED */
        .back-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            background: #00c6ff;
            color: black;
            cursor: pointer;
            font-weight: bold;
        }

        /* MAIN CENTER */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85vh;
        }

        /* CARD */
        .card {
            width: 380px;
            padding: 30px;
            border-radius: 18px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* SLOT TITLE */
        .slot-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            color: #00eaff;
        }

        /* LABEL */
        label {
            font-size: 13px;
            opacity: 0.8;
        }

        /* INPUTS */
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* FIX DROPDOWN TEXT */
        select option {
            color: black;
        }

        /* BUTTON */
        .confirm-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .confirm-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 15px #00c6ff;
        }
    </style>

</head>

<body>

<div class="navbar">
    <h2>🅿️ Book Slot</h2>
    <button class="back-btn" onclick="goBack()">Back</button>
</div>

<div class="container">
    <div class="card">

        <div class="slot-title" id="slot"></div>

        <label>Vehicle Type</label>
        <select id="vehicleType">
            <option value="">Select Vehicle</option>
            <option value="CAR">Car</option>
            <option value="BIKE">Bike</option>
            <option value="SUV">SUV</option>
            <option value="TRUCK">Truck</option>
        </select>

        <label>Vehicle Number</label>
        <input id="vehicleNumber" placeholder="AP09AB1234">

        <label>Booking Time</label>
        <input type="datetime-local" id="time">

        <button class="confirm-btn" onclick="book()">Confirm Booking</button>

    </div>
</div>

<script>

    const slot = localStorage.getItem("selectedSlot");
    document.getElementById("slot").innerText = "Slot " + slot;

    function goBack(){
        window.location.href = "slots.html";
    }

    async function book(){

        const vehicleType = document.getElementById("vehicleType").value;
        const vehicleNumber = document.getElementById("vehicleNumber").value;
        const time = document.getElementById("time").value;

        if(!vehicleType || !vehicleNumber || !time){
            alert("Please fill all details");
            return;
        }

        const data = {
            slotNumber: slot,
            vehicleType,
            vehicleNumber,
            bookingTime: time
        };

        try {
            const res = await fetch("http://localhost:8080/booking/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if(res.ok){
                window.location.href = "my-bookings.html";
            } else {
                alert("Booking failed ❌");
            }

        } catch(e){
            alert("Server not running ❌");
        }
    }

</script>

</body>
</html>
